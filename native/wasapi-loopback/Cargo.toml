[package]
name = "wasapi-loopback"
version = "0.1.0"
edition = "2021"
# MSRV 1.82.0 — the minimum supported Rust version of the `windows` crate 0.62.x.
rust-version = "1.82.0"
description = "Clean-room WASAPI process-tree EXCLUDE loopback capture as a napi-rs .node addon (Windows)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = "3.9.0"
napi-derive = "3.5.6"

# Win32 bindings for the public WASAPI Application Loopback API surface.
# Feature-gated to keep build size/time down — these six modules provide:
#   Win32_Media_Audio                -> IAudioClient / IAudioCaptureClient / ActivateAudioInterfaceAsync /
#                                       AUDIOCLIENT_ACTIVATION_PARAMS / AUDIOCLIENT_PROCESS_LOOPBACK_PARAMS /
#                                       AUDCLNT_STREAMFLAGS_* / WAVEFORMATEXTENSIBLE
#   Win32_System_Com                 -> CoInitializeEx / CoCreateGuid / COM apartment + the IUnknown vtable
#   Win32_Foundation                 -> HRESULT / S_OK / E_NOTIMPL / HANDLE / WAIT_OBJECT_0 / GENERIC errors
#   Win32_System_Threading           -> CreateEventW / WaitForSingleObject / SetEvent
#   Win32_Media_KernelStreaming      -> KSDATAFORMAT_SUBTYPE_IEEE_FLOAT (the WAVEFORMATEXTENSIBLE SubFormat)
#   Win32_System_Com_StructuredStorage -> PROPVARIANT (carries AUDIOCLIENT_ACTIVATION_PARAMS into the activation)
[dependencies.windows]
version = "0.62"
features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com_StructuredStorage",
]

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
