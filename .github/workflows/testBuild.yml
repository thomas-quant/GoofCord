name: Test build

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: win
            runner: windows-latest
            targets: "zip"
            arch: "--x64"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Install Python setuptools
        if: matrix.name == 'mac'
        run: brew install python-setuptools

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        if: matrix.name == 'win'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build spike wasapi addon
        if: matrix.name == 'win'
        shell: pwsh
        working-directory: native/wasapi-loopback
        run: |
          # Install the addon's own devDeps (@napi-rs/cli) so `bun x napi` resolves the
          # LOCAL napi binary — matching the addon repo's build.yml. Without this, bun tries
          # to fetch a bogus remote `napi` package and fails before compiling.
          bun install
          bun x napi build --release --target x86_64-pc-windows-msvc
          $node = Get-ChildItem -Path . -Filter "*.node" -Recurse | Select-Object -First 1
          if (-not $node) { Write-Error "napi build produced no .node"; exit 1 }
          $dest = Join-Path $env:GITHUB_WORKSPACE "node_modules/wasapi-loopback/prebuilds/windows-x86_64/wasapi-loopback-win32-x64.node"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Copy-Item $node.FullName $dest -Force
          Write-Host "wasapi spike addon built: $($node.FullName) -> $dest"

      - name: Install electron-builder globally
        run: bun add electron-builder -g

      # The Windows WASAPI addon arrives via the github:thomas-quant/wasapi-loopback
      # optionalDependency; this spike overwrites that prebuilt in node_modules before build.ts
      # copies it into ts-out/native/.
      - name: Build GoofCord
        run: bun run build

      - name: Package GoofCord
        run: electron-builder ${{ matrix.arch }} --${{ matrix.name }} ${{ matrix.targets }} --publish=never

      # ── Packaging presence assertion (V4 safeguard — keep) ─────────────────────────
      # A missing .node is a SILENT "loopback" fallback (Pitfall 3 — looks like the fix doesn't work,
      # with no error). The addon ships via the github:thomas-quant/wasapi-loopback optionalDependency;
      # build.ts copies it HOST-AGNOSTICALLY into ts-out/native/ with the EXACT name
      # `wasapi-loopback-win32-x64.node`, and electron-builder unpacks .node to app.asar.unpacked.
      # Assert the exact name is present in ts-out and in the packaged app.
      - name: Assert wasapi addon packaged
        if: matrix.name == 'win'
        shell: pwsh
        run: |
          $name = "wasapi-loopback-win32-x64.node"
          $tsOut = Get-ChildItem -Path "ts-out" -Filter $name -Recurse -ErrorAction SilentlyContinue
          if (-not $tsOut) { Write-Error "ASSERT FAIL: $name absent from ts-out (build.ts host-agnostic copy did not produce it)"; exit 1 }
          Write-Host "OK: present in ts-out: $($tsOut.FullName -join ', ')"
          # asarUnpack `**/*.node` unpacks it to app.asar.unpacked/ts-out/native/ — a loose file under dist/.
          $packaged = Get-ChildItem -Path "dist" -Filter $name -Recurse -ErrorAction SilentlyContinue
          if (-not $packaged) { Write-Error "ASSERT FAIL: $name missing from packaged dist/ output (not unpacked from app.asar)"; exit 1 }
          Write-Host "OK: present in packaged output: $($packaged.FullName -join ', ')"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            dist/**/*.tar.xz
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.zip
            dist/**/*.dmg
