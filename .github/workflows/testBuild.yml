name: Test build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options:
          - app
          - addon
          - both
        default: app

permissions:
  contents: write

jobs:
  # Builds ONLY the native WASAPI addon and publishes the .node.
  addon:
    name: wasapi-addon
    runs-on: windows-latest
    if: inputs.target == 'addon' || inputs.target == 'both'
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Clippy
        working-directory: native/wasapi-loopback
        run: cargo clippy --target x86_64-pc-windows-msvc

      - name: Install addon dependencies
        working-directory: native/wasapi-loopback
        run: bun install

      - name: Build addon
        working-directory: native/wasapi-loopback
        run: bun run build

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: wasapi-addon
          path: native/wasapi-loopback/*.node
          if-no-files-found: error

  # Windows x64 only: the fork's changes are Windows-specific. Runs the audio regression suite +
  # typecheck, packages win32/x64 and re-checks the addon in the packaged app.asar.unpacked output.
  windows:
    name: windows x64
    runs-on: windows-latest
    if: inputs.target == 'app' || inputs.target == 'both'
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Windows process snapshot smoke test
        run: bun tests/audio/windows-process-snapshot.ts

      - name: Audio regression tests
        run: bun test tests/audio

      - name: Verify local electron-builder version
        run: |
          bun -e "const expected = (await Bun.file('package.json').json()).devDependencies['electron-builder']; const actual = (await Bun.file('node_modules/electron-builder/package.json').json()).version; console.log('Local electron-builder version=' + actual); if (actual !== expected) throw new Error('Expected electron-builder ' + expected);"

      - name: Build GoofCord
        run: bun run build --skipTypecheck

      - name: Package GoofCord (win32 x64 only)
        run: bunx --no-install electron-builder --x64 --win zip --publish=never

      - name: Verify packaged addon (asar.unpacked, real API load)
        run: bun build/validateWasapiPackaged.ts dist/win-unpacked

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifacts
          path: dist/**/*.zip
          if-no-files-found: error
