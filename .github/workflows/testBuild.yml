name: Test build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options:
          - app
          - addon
          - both
        default: app

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            targets: "tar.xz AppImage deb rpm"
            arch: "--x64 --arm64 --armv7l"
          - name: win
            runner: windows-latest
            targets: "zip"
            arch: "--x64 --ia32 --arm64"
          - name: mac
            runner: macos-latest
            targets: "dmg"
            arch: "--x64 --arm64"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    if: inputs.target == 'app' || inputs.target == 'both'
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Install Python setuptools
        if: matrix.name == 'mac'
        run: brew install python-setuptools

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Install electron-builder globally
        run: bun add electron-builder -g

      - name: Build GoofCord
        run: bun run build

      - name: Package GoofCord
        run: electron-builder ${{ matrix.arch }} --${{ matrix.name }} ${{ matrix.targets }} --publish=never

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            dist/**/*.tar.xz
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.zip
            dist/**/*.dmg

  # Builds ONLY the native WASAPI addon and publishes the .node. Split out from the app matrix
  # because packaging three desktop platforms takes ~20 min and tells you nothing about the addon.
  addon:
    name: wasapi-addon
    runs-on: windows-latest
    if: inputs.target == 'addon' || inputs.target == 'both'
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Clippy
        working-directory: native/wasapi-loopback
        run: cargo clippy --target x86_64-pc-windows-msvc

      - name: Install addon dependencies
        working-directory: native/wasapi-loopback
        run: bun install

      - name: Build addon
        working-directory: native/wasapi-loopback
        run: bun run build

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: wasapi-addon
          path: native/wasapi-loopback/*.node
          if-no-files-found: error
