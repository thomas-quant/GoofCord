name: Test build

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: win
            runner: windows-latest
            targets: "zip"
            arch: "--x64"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Github checkout
        uses: actions/checkout@v4

      - name: Install Python setuptools
        if: matrix.name == 'mac'
        run: brew install python-setuptools

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Install Node dependencies
        run: bun install --frozen-lockfile

      - name: Install electron-builder globally
        run: bun add electron-builder -g

      # ── PHASE-5 REMOVAL (Plan 04-03) ────────────────────────────────────────────────
      # The Windows WASAPI EXCLUDE-tree echo-fix addon (native/wasapi-loopback) is built here
      # on the windows-latest runner and fed into the GoofCord build via the
      # GOOFCORD_WASAPI_LOOPBACK_PATH env override (copyNativeModules() honors it). This
      # temporarily couples CI to Rust; Phase 5 removes these steps + the env var when the addon
      # moves to its own published repo + optionalDependencies (like venbind's prebuilt .node).
      # A Rust COMPILE ERROR fails the job HERE — caught before the expensive second-device test.
      - name: Install Rust toolchain (wasapi-loopback addon)
        if: matrix.name == 'win'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build wasapi-loopback addon (.node)
        if: matrix.name == 'win'
        working-directory: native/wasapi-loopback
        shell: pwsh
        run: |
          bun add -d "@napi-rs/cli@3.7.0"
          bun x napi build --release --target x86_64-pc-windows-msvc
          # napi names the output `wasapi-loopback.win32-x64-msvc.node` (or similar); locate it and
          # normalize to the exact glob-matched name `wasapi-loopback-win32-x64.node` (contains BOTH
          # win32 AND x64 — Pitfall 3). copyNativeModules() copies+renames via the env override below.
          $node = Get-ChildItem -Path . -Filter "*.node" -Recurse | Select-Object -First 1
          if (-not $node) { Write-Error "napi build produced no .node"; exit 1 }
          $dest = Join-Path $PWD "wasapi-loopback-win32-x64.node"
          Copy-Item $node.FullName $dest -Force
          Write-Host "wasapi addon built: $($node.FullName) -> $dest"
          "GOOFCORD_WASAPI_LOOPBACK_PATH=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build GoofCord
        run: bun run build

      - name: Package GoofCord
        run: electron-builder ${{ matrix.arch }} --${{ matrix.name }} ${{ matrix.targets }} --publish=never

      # ── PHASE-5 REMOVAL (Plan 04-03): packaging assertion ──────────────────────────
      # A missing .node is otherwise a SILENT "loopback" fallback (Pitfall 3 — looks like the fix
      # doesn't work, with no error). The native-module: bundler plugin (build/nativeImport.ts) copies
      # the .node into ts-out ROOT via Bun's file loader, which HASHES the basename — e.g.
      # ts-out/wasapi-loopback-win32-x64-<hash>.node (same shape as venbind's), NOT ts-out/native/ and
      # NOT the exact name. Assert the hashed pattern is present in ts-out and in the packaged app.
      - name: Assert wasapi addon packaged
        if: matrix.name == 'win'
        shell: pwsh
        run: |
          # ── DIAGNOSTICS (temporary): show what actually bundled, to localize a Windows-host gap ──
          Write-Host "--- assets/native/*.node (staged by copyNativeModules) ---"
          Get-ChildItem -Path "assets/native" -Filter "*.node" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
          Write-Host "--- ts-out/**/*.node (bundled by native-module plugin; venbind is the control) ---"
          Get-ChildItem -Path "ts-out" -Filter "*.node" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Host "----------------------------------------------------------------------------------"
          $pattern = "wasapi-loopback-win32-x64-*.node"
          $tsOut = Get-ChildItem -Path "ts-out" -Filter $pattern -Recurse -ErrorAction SilentlyContinue
          if (-not $tsOut) { Write-Error "ASSERT FAIL: no $pattern in ts-out (copyNativeModules + native-module bundler did not produce it)"; exit 1 }
          Write-Host "OK: present in ts-out: $($tsOut.Name -join ', ')"
          # electron-builder unpacks .node to app.asar.unpacked; the recursive search finds it under dist/.
          $packaged = Get-ChildItem -Path "dist" -Filter $pattern -Recurse -ErrorAction SilentlyContinue
          if (-not $packaged) { Write-Error "ASSERT FAIL: $pattern missing from packaged dist/ output"; exit 1 }
          Write-Host "OK: present in packaged output: $($packaged.FullName -join ', ')"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-artifacts
          path: |
            dist/**/*.tar.xz
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.zip
            dist/**/*.dmg
